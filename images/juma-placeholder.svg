<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1130" width="800" height="1130">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="50%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#e6fffa"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="50%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <pattern id="islamicPattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M30 0 L60 30 L30 60 L0 30 Z" fill="none" stroke="#10b981" stroke-width="0.75" opacity="0.12"/>
      <circle cx="30" cy="30" r="10" fill="none" stroke="#0f766e" stroke-width="0.75" opacity="0.12"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="1130" fill="url(#bgGrad)"/>
  <rect width="800" height="1130" fill="url(#islamicPattern)"/>

  <!-- Border Frame -->
  <rect x="25" y="25" width="750" height="1080" rx="20" fill="none" stroke="#0f766e" stroke-width="3" opacity="0.4"/>
  <rect x="35" y="35" width="730" height="1060" rx="16" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.5"/>

  <!-- Top Header Banner -->
  <g filter="url(#shadow)">
    <rect x="50" y="55" width="700" height="140" rx="18" fill="url(#headerGrad)"/>
    <rect x="50" y="185" width="700" height="10" rx="3" fill="url(#goldGrad)"/>
  </g>

  <!-- Header Text -->
  <text x="400" y="115" text-anchor="middle" font-family="'Noto Nastaliq Urdu', serif, sans-serif" font-size="34" font-weight="bold" fill="#ffffff">صوبائی جمعیت اہل حدیث، ممبئی</text>
  <text x="400" y="155" text-anchor="middle" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#fef3c7" letter-spacing="4">SUBAI JAMIAT AHLE HADEES MUMBAI</text>

  <!-- Main Center Card -->
  <g filter="url(#shadow)">
    <rect x="90" y="240" width="620" height="660" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  </g>

  <!-- Mosque / Crescent Icon Badge -->
  <circle cx="400" cy="340" r="55" fill="#f0fdfa" stroke="#0d9488" stroke-width="3"/>
  <path d="M380 340 C380 320 400 310 400 310 C400 310 420 320 420 340 C420 360 400 370 400 370 C400 370 380 360 380 340 Z" fill="#0f766e"/>
  <circle cx="400" cy="302" r="5" fill="#f59e0b"/>
  <!-- Minarets -->
  <rect x="365" y="335" width="10" height="35" rx="3" fill="#0d9488"/>
  <polygon points="370,325 365,335 375,335" fill="#f59e0b"/>
  <rect x="425" y="335" width="10" height="35" rx="3" fill="#0d9488"/>
  <polygon points="430,325 425,335 435,335" fill="#f59e0b"/>

  <!-- Title Section -->
  <text x="400" y="445" text-anchor="middle" font-family="'Noto Nastaliq Urdu', serif, sans-serif" font-size="44" font-weight="bold" fill="#0f766e">خطباتِ جمعہ</text>
  <text x="400" y="485" text-anchor="middle" font-family="'Oswald', sans-serif" font-size="22" font-weight="700" fill="#d97706" letter-spacing="3">KHUTBAAT-E-JUMU'AH</text>
  
  <line x1="250" y1="515" x2="550" y2="515" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6,6"/>

  <!-- Info Box -->
  <rect x="140" y="550" width="520" height="150" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="400" y="600" text-anchor="middle" font-family="'Noto Nastaliq Urdu', serif, sans-serif" font-size="24" font-weight="bold" fill="#1e293b">تاریخی خطبہ جمعہ شیڈیول</text>
  <text x="400" y="640" text-anchor="middle" font-family="'Noto Nastaliq Urdu', serif, sans-serif" font-size="16" fill="#64748b">اس جمعہ کا اصل پوسٹر ڈیٹا بیس میں محفوظ کرنے کے لیے تیار ہے</text>
  <text x="400" y="675" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#0f766e" letter-spacing="1">HISTORICAL ARCHIVE RECORD</text>

  <!-- Edit Guide Badge -->
  <rect x="220" y="730" width="360" height="48" rx="24" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="400" y="760" text-anchor="middle" font-family="'Noto Nastaliq Urdu', serif, sans-serif" font-size="16" font-weight="bold" fill="#92400e">✏️ ایڈمن پینل سے پوسٹر امیج اپلوڈ کریں</text>

  <!-- Bottom Footer -->
  <rect x="50" y="930" width="700" height="90" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="400" y="970" text-anchor="middle" font-family="'Noto Nastaliq Urdu', serif, sans-serif" font-size="18" font-weight="bold" fill="#0f766e">صوبائی جمعیت اہل حدیث ممبئی — شعبہ مساجد و خطبات</text>
  <text x="400" y="1000" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">Official Historical Archive System (2018 — 2026)</text>
</svg>
